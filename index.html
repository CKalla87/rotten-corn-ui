    <!-- Runtime environment variables - can be injected by server/CDN -->
    <script>
      // Inject runtime environment variables if available
      // This allows environment variables to be set at runtime via server-side injection
      // Format: window.__ENV__ = { VITE_CLOUD_NAME: 'your-cloud-name' };
      if (typeof window !== 'undefined') {
        window.__ENV__ = window.__ENV__ || {};
      }
    </script>
