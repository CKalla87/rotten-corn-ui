<svg width="100" height="45" viewBox="0 0 100 45" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="200%" y2="200%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#764ba2;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1"/>
      <animate attributeName="x1" values="0%;200%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0%;200%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200%;0%;200%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="200%;0%;200%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  
  <!-- Speech bubble - organic cloud shape with animated gradient -->
  <path d="M 50 8 
           C 45 8, 41 10, 41 14
           C 38 14, 36 16, 36 19
           C 36 22, 38 24, 41 24
           C 42 26, 44 27, 46 27
           C 48 27, 50 25, 50 23
           C 50 25, 52 27, 54 27
           C 56 27, 58 26, 59 24
           C 62 24, 64 22, 64 19
           C 64 16, 62 14, 59 14
           C 59 10, 55 8, 50 8 Z" 
        fill="url(#logoGradient)"/>
  
  <!-- Small tail pointing down with gradient -->
  <path d="M 50 24 L 46 28 L 50 26 L 54 28 Z" fill="url(#logoGradient)"/>
</svg>
